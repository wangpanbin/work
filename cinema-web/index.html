<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星辉影城 - 抢票选座</title>
    <!-- P4-1:原本没有 favicon,每次首访 console 都报一条 404。
         用内联 SVG data-URI 而非 public/favicon.ico:省一个二进制文件,
         也不需要改 vite 配置。
         票根造型 —— 与 BrandMark.vue 同源(票面框 + 齿孔虚线 + 条码),
         底 #f2ece1 (--paper), 印色 #b8352a (--accent)。改主题时这两个值要跟着改。 -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f2ece1'/%3E%3Crect x='5.5' y='8' width='21' height='16' rx='2' fill='none' stroke='%23b8352a' stroke-width='2'/%3E%3Cline x1='15' y1='10.5' x2='15' y2='21.5' stroke='%23b8352a' stroke-width='2' stroke-linecap='round' stroke-dasharray='0.1 3'/%3E%3Crect x='18' y='12' width='1.6' height='8' fill='%23b8352a'/%3E%3Crect x='21' y='12' width='1' height='8' fill='%23b8352a'/%3E%3Crect x='23.6' y='12' width='1.8' height='8' fill='%23b8352a'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 票根主题三档字体: 衬线标题(Noto Serif SC, 中文衬线才成立) /
         无衬线正文(Noto Sans SC) / 等宽票号(IBM Plex Mono)。
         中文衬线只引 500+700 两档控制体积; 全部 display=swap。 -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
