<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星辉影城 - 抢票选座</title>
    <!-- P4-1:原本没有 favicon,每次首访 console 都报一条 404。
         用内联 SVG data-URI 而非 public/favicon.ico:省一个二进制文件,
         也不需要改 vite 配置。
         票根造型 —— 与 BrandMark.vue 同源(票面框 + 齿孔虚线 + 条码),
         底 #eef1f6 (--paper), 印色 #2563eb (--accent)。改主题时这两个值要跟着改。
         ⚠️ 双主题后这份是「浅色 favicon」; 暗色那份在 src/theme/apply.ts,
            由 applyTheme() 切换 href。id 供主题模块定位。 -->
    <link
      id="cinema-favicon"
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23eef1f6'/%3E%3Crect x='5.5' y='8' width='21' height='16' rx='2' fill='none' stroke='%232563eb' stroke-width='2'/%3E%3Cline x1='15' y1='10.5' x2='15' y2='21.5' stroke='%232563eb' stroke-width='2' stroke-linecap='round' stroke-dasharray='0.1 3'/%3E%3Crect x='18' y='12' width='1.6' height='8' fill='%232563eb'/%3E%3Crect x='21' y='12' width='1' height='8' fill='%232563eb'/%3E%3Crect x='23.6' y='12' width='1.8' height='8' fill='%232563eb'/%3E%3C/svg%3E"
    />
    <!-- 首屏防白闪 (The Two-Mode Rule) -------------------------------------------
         必须在 Vue 挂载前同步跑完, 否则深色模式下首帧会白闪一下。
         只做两件事: 设 data-theme 属性(CSS token 作用域) + 挂 dark 类名
         (Element Plus 官方暗色变量表的开关)。
         解析逻辑与 src/theme/resolve.ts 的 resolveTheme 一致; 这里重复一遍是
         有意的 —— 模块还没加载, 首帧等不起它。
         读不到 localStorage / matchMedia 缺失时一律退回亮色, 不抛错。 -->
    <script>
      ;(function () {
        try {
          var pref = localStorage.getItem('cinema_theme')
          if (pref !== 'light' && pref !== 'dark') pref = 'auto'
          var sysDark =
            !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var dark = pref === 'dark' || (pref === 'auto' && sysDark)
          var root = document.documentElement
          root.setAttribute('data-theme', dark ? 'dark' : 'light')
          if (dark) root.classList.add('dark')
        } catch (e) {
          /* 隐私模式禁用了 storage, 或 matchMedia 缺失 —— 保持默认亮色即可 */
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 票根主题三档字体: 衬线标题(Noto Serif SC, 中文衬线才成立) /
         无衬线正文(Noto Sans SC) / 等宽票号(IBM Plex Mono)。
         只引实际用到的字重: 中文衬线 500+700, 正文 400/500/700(无 300),
         等宽 400+600; 全部 display=swap, 省掉从未使用的字重体积。 -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
