server:
  port: 8080
  # Phase A-⑩: 显式配 Tomcat 线程池, 压测 200 并发下不成为瓶颈
  tomcat:
    threads:
      max: 200
      min-spare: 50
    accept-count: 200
    max-connections: 8192
    connection-timeout: 5s

spring:
  application:
    name: cinema-server
  profiles:
    # 2026-10-24: 原先硬编码 dev —— 任何未显式覆盖 profile 的部署(容器 / 他人机器)
    # 都会以 dev 启动, 从而触发 DataInitializer 自动播种 role=1 的 admin/123456。
    # 改成环境变量可切换: 生产部署设 SPRING_PROFILES_ACTIVE=prod 即可。
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

cinema:
  jwt:
    # 生产环境务必更换(至少32字节)并从环境变量注入
    # 2026-10-24: 补上 ${JWT_SECRET:...} 回退 —— 原先写死在文件里, 改法只能靠改文件,
    # 密钥随仓库分发, 拿到源码就能伪造任意 userId + role=1 的 token。
    secret: ${JWT_SECRET:cinema-dev-secret-key-change-me-32bytes-min!!}
    expire-hours: 72
  cors:
    # 2026-10-24: 原先 allowedOriginPatterns("*") 全开 —— 任意站点的网页都能读 API 响应,
    # 配合登录端点无限流, 撞库可以直接在浏览器里完成。收敛成白名单, 逗号分隔。
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  seed:
    # 2026-10-24: dev profile 下播种测试账号(admin 默认 role=1)。
    # 生产部署必须显式设为 false(或改用 SPRING_PROFILES_ACTIVE 切到非 dev profile)。
    admin-enabled: ${CINEMA_SEED_ADMIN_ENABLED:true}
  chat:
    # 对话助手的**模型来源**: deepseek(真实 LLM, 默认) | stub(假 LLM, 确定性回复)。
    # stub 只替换「模型决策」这一步 —— 卡片解析、提案装配、座位重读、前端渲染全是生产代码。
    # 用途: 让「一键下单确认卡」那条浏览器链路能确定性回归(真实 LLM 出不出卡看模型当天发挥)。
    # ⚠️ stub 下**不调用任何外部模型**, 也不需要 api-key; 但它同样只读, 不写任何业务数据。
    provider: ${CINEMA_CHAT_PROVIDER:deepseek}
    # 对话助手 LLM 配置(env 驱动;ChatConfig @ConditionalOnExpression 仅在 key 非空时注册 ChatModel Bean)
    # 设置 `DEEPSEEK_API_KEY` 环境变量后,/api/chat/message 才会接通 LLM(否则 50000 + "对话功能未配置" 短路)
    # 示例(setx DEEPSEEK_API_KEY "sk-xxx" 后重启 cmd / PowerShell,USER 级别即可)
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${CINEMA_CHAT_BASE_URL:https://api.deepseek.com/v1}
    model-name: ${CINEMA_CHAT_MODEL_NAME:deepseek-chat}
    timeout-seconds: ${CINEMA_CHAT_TIMEOUT_SECONDS:90}
    max-retries: ${CINEMA_CHAT_MAX_RETRIES:2}
    # 一键下单(ADR-0004):关闭后助手不再生成下单提案, /api/chat/orders/** 一律拒服务。
    # 这是整条写路径的回滚闸门 —— 不发版即可让助手退回纯只读。
    order-enabled: ${CINEMA_CHAT_ORDER_ENABLED:true}
    # 下单提案快照的存活秒数。提案**不占位**, 只是「已算好的报价与座位方案」。
    proposal-ttl-seconds: ${CINEMA_CHAT_PROPOSAL_TTL_SECONDS:90}
    # 估算单价(IT-11 用量看板): 每 100 万 token 的价格, 单位 = 美分(USD cents)。
    # 取价日期 2026-10-25, 来源 https://api-docs.deepseek.com/quick_start/pricing
    #   deepseek-flash 非高峰: 输入 $0.15 / 输出 $0.60 每 1M token
    # ⚠️ 这是**估算**, 不是财务口径 —— DeepSeek 会调价且分峰谷时段, 单价需人工维护。
    #   配成 0 = 未配置单价 → 成本记 null(不记 0, 0 会被误读成「免费」)。
    cost:
      prompt-per-million-cents: ${CINEMA_CHAT_PROMPT_PRICE_PER_MILLION_CENTS:15}
      completion-per-million-cents: ${CINEMA_CHAT_COMPLETION_PRICE_PER_MILLION_CENTS:60}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
